<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiclock - Universal Dashboard</title>
    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕒</text></svg>"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #f1f5f9;
      }

      .mono {
        font-family: "JetBrains Mono", monospace;
      }

      .glass-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          opacity 0.2s ease;
      }

      .glass-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }

        <div class="row">
            <div class="col-md-4 date">
                <div class="region">Local Date</div><span id=local_date>**-**-**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">UTC</div><span id=utc_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">Epoch</div><span id=epoch_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">Japan</div><span id=japan_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">UK</div><span id=uk_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">Central Europe</div><span id=central_europe_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">East Coast</div><span id=eastern_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">Central</div><span id=central_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">Mountain</div><span id=mountain_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">West Coast</div><span id=pacific_time>**:**:**</span>
            </div>
            <div class="col-md-4 time">
                <div class="region">ACWST</div><span id=acwst_time>**:**:**</span>
            </div>
          </div>
        </div>

        <!-- Custom Clocks Grid -->
        <div
          id="custom-clocks"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
        >
          <!-- User added clocks appear here -->
        </div>
      </div>

      <!-- Simple Message Box for info -->
      <div
        id="message-box"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 bg-blue-600 text-white rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 translate-y-4"
      >
        Timezone added successfully
      </div>
    </div>

</html>
